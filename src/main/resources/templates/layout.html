<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, headerTitle, headerSubtitle, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">RentCar</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Sidebar -->
<div th:replace="fragments/nav :: nav"></div>

<!-- Шапка -->
<div class="topbar">
    <h1 th:text="${headerTitle}">Заголовок</h1>
    <p th:text="${headerSubtitle}">Подзаголовок</p>
</div>

<!-- Контент страницы -->
<div class="container" th:replace="${content}"></div>

<!-- ===== AI АССИСТЕНТ ===== -->
<button id="aiBtn" onclick="toggleChat()"
        style="position:fixed; bottom:24px; right:24px; z-index:9999;
               width:56px; height:56px; border-radius:50%; border:none;
               background:#2c3e50; color:white; font-size:24px;
               cursor:pointer; box-shadow:0 4px 20px rgba(0,0,0,0.3);">
    🤖
</button>

<div id="aiChat"
     style="display:none; position:fixed; bottom:90px; right:24px; z-index:9999;
            width:360px; height:500px; background:white; border-radius:16px;
            box-shadow:0 8px 40px rgba(0,0,0,0.2); flex-direction:column; overflow:hidden;">

    <div style="background:#2c3e50; color:white; padding:14px 16px;
                display:flex; justify-content:space-between; align-items:center;">
        <div>
            <div style="font-weight:800; font-size:15px;">🤖 RentCar Ассистент</div>
            <div style="font-size:12px; opacity:0.8;">Помогу с любыми вопросами</div>
        </div>
        <button onclick="toggleChat()"
                style="background:transparent; border:none; color:white;
                       font-size:20px; cursor:pointer;">✕</button>
    </div>

    <div id="aiMessages"
         style="flex:1; overflow-y:auto; padding:14px; display:flex;
                flex-direction:column; gap:10px;">
        <div style="background:#f4f6f8; border-radius:12px; padding:10px 12px;
                    font-size:14px; color:#2c3e50; max-width:85%;">
            Привет! Я ассистент сервиса аренды автомобилей 🚗<br><br>
            Могу помочь с вопросами об автомобилях, арендах, сотрудниках и работе системы.
        </div>
    </div>

    <div id="quickQuestions"
         style="padding:8px 14px; display:flex; gap:6px; flex-wrap:wrap;
                border-top:1px solid #f0f0f0;">
        <button onclick="sendQuick('Как создать аренду?')"
                style="font-size:12px; padding:4px 8px; border-radius:20px;
                       border:1px solid #d0d6dc; background:white; cursor:pointer; color:#2c3e50;">
            Создать аренду
        </button>
        <button onclick="sendQuick('Как добавить автомобиль?')"
                style="font-size:12px; padding:4px 8px; border-radius:20px;
                       border:1px solid #d0d6dc; background:white; cursor:pointer; color:#2c3e50;">
            Добавить авто
        </button>
        <button onclick="sendQuick('Как завершить аренду?')"
                style="font-size:12px; padding:4px 8px; border-radius:20px;
                       border:1px solid #d0d6dc; background:white; cursor:pointer; color:#2c3e50;">
            Завершить аренду
        </button>
    </div>

    <div style="padding:10px 14px; border-top:1px solid #f0f0f0;
                display:flex; gap:8px; align-items:center;">
        <input id="aiInput" type="text"
               placeholder="Напишите вопрос..."
               onkeydown="if(event.key==='Enter') sendMessage()"
               style="flex:1; padding:9px 12px; border:1px solid #d0d6dc;
                      border-radius:20px; font-size:14px; outline:none;">
        <button onclick="sendMessage()"
                style="width:36px; height:36px; border-radius:50%; border:none;
                       background:#2c3e50; color:white; font-size:16px;
                       cursor:pointer;">➤</button>
    </div>
</div>

<script th:inline="none">
    function toggleChat() {
        const chat = document.getElementById('aiChat');
        if (chat.style.display === 'none' || chat.style.display === '') {
            chat.style.display = 'flex';
            document.getElementById('aiInput').focus();
        } else {
            chat.style.display = 'none';
        }
    }

    function sendQuick(text) {
        document.getElementById('aiInput').value = text;
        sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('aiInput');
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        addMessage(text, 'user');
        const loadingId = addLoading();

        try {
            const response = await fetch('/api/ai/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            removeLoading(loadingId);
            const data = await response.json();
            addMessage(data.reply || 'Нет ответа', 'bot');

        } catch (error) {
            removeLoading(loadingId);
            addMessage('Ошибка соединения. Попробуйте позже.', 'bot');
        }

        document.getElementById('quickQuestions').style.display = 'none';
    }

    function addMessage(text, type) {
        const messages = document.getElementById('aiMessages');
        const div = document.createElement('div');
        div.style.cssText = type === 'user'
            ? 'background:#2c3e50;color:white;border-radius:12px;padding:10px 12px;font-size:14px;max-width:85%;align-self:flex-end;margin-left:auto;white-space:pre-wrap;'
            : 'background:#f4f6f8;color:#2c3e50;border-radius:12px;padding:10px 12px;font-size:14px;max-width:85%;white-space:pre-wrap;';
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    function addLoading() {
        const messages = document.getElementById('aiMessages');
        const div = document.createElement('div');
        div.id = 'loading-' + Date.now();
        div.style.cssText = 'background:#f4f6f8;color:#888;border-radius:12px;padding:10px 12px;font-size:14px;max-width:85%;';
        div.textContent = '⏳ Думаю...';
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div.id;
    }

    function removeLoading(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }
</script>

</body>
</html>
